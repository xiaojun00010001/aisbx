name: cross-platform-smoke

# 方案 B 契约的三平台验证:
#   windows-smoke.yml 负责 Windows 的原生断言(冒烟);
#   本工作流负责 Linux/macOS 的 B 契约冒烟 + Windows 编译检查。
#
# ⚠️ 步骤顺序原则:**主验证(冒烟)在前,门禁(fmt/clippy/test)在后**。
#   门禁一红就把后面的步骤全挡住 → 一次失败什么信息都拿不到。
#   倒序后即使门禁红,冒烟结果也已经落盘并回写。
#   失败时把完整日志发到 Issue(公开仓库可无鉴权读取),便于远端诊断。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # contents: write —— 用于把本次运行的结果(冒烟日志 / clippy 输出)回写仓库,
  # 这样「CI 结果」不依赖 GitHub API 配额也能读到(git fetch 即可)。
  contents: write
  issues: write

jobs:
  unix-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap iproute2

      - name: Toolchain
        run: rustc -Vv && cargo -V && cargo fmt --version

      - name: Build
        run: cargo build --bins --example burn

      - name: Capability report
        run: cargo run --quiet --bin aisbx -- capabilities

      # ── 主验证:冒烟先跑 ────────────────────────────────────────────
      - name: Smoke (B contract)
        shell: bash
        run: bash scripts/smoke-unix.sh 2>&1 | tee smoke.log

      # ── 门禁后置:红了不影响上面已拿到的冒烟结果 ──────────────────────
      - name: Format check
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee fmt.log

      - name: Clippy (deny warnings)
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log

      # ⚠️ 此前只跑 `cargo test -p aisbx-policy`,aisbx crate 自身的单测从未进 CI。
      - name: Unit tests (all crates)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log

      - name: Publish run result to repo
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p ci/runs
          out="ci/runs/${{ github.run_id }}-${{ matrix.os }}.md"
          {
            echo "# CI run ${{ github.run_id }} (${{ matrix.os }})"
            echo
            echo "- commit: ${{ github.sha }}"
            echo "- workflow: ${{ github.workflow }}"
            echo "- job status: ${{ job.status }}"
            echo
            echo '```text'
            # 各文件分别截断:合并 tail 会让前面的门禁日志被长冒烟日志挤掉
            for f in smoke.log fmt.log clippy.log test.log; do
              echo "===== $f ====="
              tail -n 120 "$f" 2>/dev/null || true
            done
            echo '```'
          } > "$out"
          export GIT_EDITOR=true
          export GIT_TERMINAL_PROMPT=0
          git config --global core.editor true || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci
          git commit -q -m "ci: record run ${{ github.run_id }} ${{ matrix.os }} [skip ci]" || exit 0
          # 三个 job 并发回写会互相冲突 → 先 rebase 再推
          # actions/checkout 可能是 detached HEAD → 先确保在 main 分支上,
          # 否则 push 推不动(实测后完成的 job 回写全部丢失)。
          git checkout -B ci-results || git switch ci-results || git checkout main || true
          # 三个 job 并发回写会互相冲突 → 先 rebase 再推
          git pull --rebase origin ci-results || { git rebase --abort || true; }
          git push origin HEAD:ci-results || echo "::notice::结果回写失败(分支可能受保护),请看 run 日志与 Issue"

      - name: Publish failure log
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: smoke failure ${{ github.run_id }} ${{ matrix.os }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          { test -f smoke.log || echo "no smoke.log"; } > all.log
          for f in fmt.log clippy.log test.log; do
            { echo "===== $f ====="; cat "$f" 2>/dev/null; } >> all.log
          done
          # 用 curl 而不是 python urllib:CI 上 python 的 SSL 上下文常缺中间证书,
          # urllib 会抛 CERTIFICATE_VERIFY_FAILED,导致这个步骤本身失败、
          # 把真正的失败日志一起丢掉。
          title="smoke failure ${{ github.run_id }} ${{ matrix.os }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 - <<'PY'
          import json, os
          raw = open("all.log", errors="replace").read()[-60000:]
          run = os.environ["RUN_URL"]
          body = "run: " + run + "\n\n```text\n" + raw + "\n```\n"
          open("issue.json", "w").write(json.dumps(
              {"title": os.environ["TITLE"], "body": body}, ensure_ascii=False))
          PY
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues" \
            --data @issue.json -o issue.out -w "issue status %{http_code}\n" || true
          cat issue.out 2>/dev/null | head -c 300 || true

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustc -Vv && cargo -V && cargo fmt --version
      - name: Build (Windows backend unchanged)
        run: cargo build --bins --example burn
      - name: Cargo check all targets
        run: cargo check --all-targets
      - name: Capability report
        run: cargo run --quiet --bin aisbx -- capabilities
      - name: Format check
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee fmt.log
      - name: Clippy (deny warnings)
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Unit tests (all crates)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log
      - name: Publish run result to repo
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p ci/runs
          out="ci/runs/${{ github.run_id }}-windows-check.md"
          {
            echo "# CI run ${{ github.run_id }} (windows-check)"
            echo
            echo "- commit: ${{ github.sha }}"
            echo "- job status: ${{ job.status }}"
            echo
            echo '```text'
            cat fmt.log clippy.log test.log 2>/dev/null | tail -n 300 || true
            echo '```'
          } > "$out"
          export GIT_EDITOR=true
          export GIT_TERMINAL_PROMPT=0
          git config --global core.editor true || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci
          git commit -q -m "ci: record run ${{ github.run_id }} windows-check [skip ci]" || exit 0
          git checkout -B ci-results || git switch ci-results || git checkout main || true
          git pull --rebase origin ci-results || { git rebase --abort || true; }
          git push origin HEAD:ci-results || echo "::notice::结果回写失败,请看 run 日志与 Issue"
