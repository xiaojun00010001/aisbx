name: cross-platform-smoke

# 方案 B 契约的三平台验证:
#   windows-smoke.yml 负责 Windows 的原生断言(冒烟);
#   本工作流负责 Linux/macOS 的 B 契约冒烟 + Windows 编译检查。
#
# ⚠️ 步骤顺序原则:**主验证(冒烟)在前,门禁(fmt/clippy/test)在后**。
#   门禁一红就把后面的步骤全挡住 → 一次失败什么信息都拿不到。
#   倒序后即使门禁红,冒烟结果也已经落盘并回写。
#   失败时把完整日志发到 Issue(公开仓库可无鉴权读取),便于远端诊断。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # contents: write —— 用于把本次运行的结果(冒烟日志 / clippy 输出)回写仓库,
  # 这样「CI 结果」不依赖 GitHub API 配额也能读到(git fetch 即可)。
  contents: write
  issues: write

jobs:
  unix-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap iproute2

      - name: Toolchain
        run: rustc -Vv && cargo -V && cargo fmt --version

      - name: Build
        run: cargo build --bins --example burn

      - name: Capability report
        run: cargo run --quiet --bin aisbx -- capabilities

      # ── 主验证:冒烟先跑 ────────────────────────────────────────────
      - name: Smoke (B contract)
        shell: bash
        run: bash scripts/smoke-unix.sh 2>&1 | tee smoke.log

      # ── 门禁后置:红了不影响上面已拿到的冒烟结果 ──────────────────────
      - name: Format check
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee fmt.log

      - name: Clippy (deny warnings)
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log

      # ⚠️ 此前只跑 `cargo test -p aisbx-policy`,aisbx crate 自身的单测从未进 CI。
      - name: Unit tests (all crates)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log

      - name: Publish run result to repo
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p ci/runs
          out="ci/runs/${{ github.run_id }}-${{ matrix.os }}.md"
          {
            echo "# CI run ${{ github.run_id }} (${{ matrix.os }})"
            echo
            echo "- commit: ${{ github.sha }}"
            echo "- workflow: ${{ github.workflow }}"
            echo "- job status: ${{ job.status }}"
            echo
            echo '```text'
            cat smoke.log fmt.log clippy.log test.log 2>/dev/null | tail -n 500 || true
            echo '```'
          } > "$out"
          cp "$out" ci/last-run.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci
          git commit -q -m "ci: record run ${{ github.run_id }} ${{ matrix.os }} [skip ci]" || exit 0
          # 三个 job 并发回写会互相冲突 → 先 rebase 再推
          git pull --rebase origin main || true
          git push || echo "::notice::结果回写失败(分支可能受保护),请看 run 日志与 Issue"

      - name: Publish failure log
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { test -f smoke.log || echo "no smoke.log"; } > all.log
          for f in fmt.log clippy.log test.log; do
            { echo "===== $f ====="; cat "$f" 2>/dev/null; } >> all.log
          done
          python3 - <<'PY'
          import json, os, urllib.request
          raw = open("all.log", errors="replace").read()[-60000:]
          title = "smoke failure %s %s" % (os.environ["GITHUB_RUN_ID"], os.environ["RUNNER_OS"])
          run = "%s/%s/actions/runs/%s" % (
              os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"])
          body = "run: " + run + "\n\n```text\n" + raw + "\n```\n"
          req = urllib.request.Request(
              os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"] + "/issues",
              data=json.dumps({"title": title, "body": body}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print("issue status", urllib.request.urlopen(req).status)
          PY

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustc -Vv && cargo -V && cargo fmt --version
      - name: Build (Windows backend unchanged)
        run: cargo build --bins --example burn
      - name: Cargo check all targets
        run: cargo check --all-targets
      - name: Capability report
        run: cargo run --quiet --bin aisbx -- capabilities
      - name: Format check
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee fmt.log
      - name: Clippy (deny warnings)
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Unit tests (all crates)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log
      - name: Publish run result to repo
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p ci/runs
          out="ci/runs/${{ github.run_id }}-windows-check.md"
          {
            echo "# CI run ${{ github.run_id }} (windows-check)"
            echo
            echo "- commit: ${{ github.sha }}"
            echo "- job status: ${{ job.status }}"
            echo
            echo '```text'
            cat fmt.log clippy.log test.log 2>/dev/null | tail -n 300 || true
            echo '```'
          } > "$out"
          cp "$out" ci/last-run.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci
          git commit -q -m "ci: record run ${{ github.run_id }} windows-check [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push || echo "::notice::结果回写失败(分支可能受保护),请看 run 日志"
