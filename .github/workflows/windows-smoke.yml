name: windows-smoke

# ⚠️ 步骤顺序原则:**主验证(冒烟)在前,门禁(test)在后**。
#   门禁一红就把后面的步骤全挡住 → 一次失败什么信息都拿不到。
#   倒序后即使单测红,冒烟结果也已经落盘并回写。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # contents: write —— 回写本次运行结果(与 cross-platform.yml 同理)
  contents: write
  issues: write

jobs:
  smoke:
    runs-on: windows-latest
    # ⚠️ 12/30 分钟都不够:Windows 的 46 项断言里有多处等待(T2 token 授权 90 秒、
    # T12/T13 各 60 秒),加上 AppContainer/icacls 开销与 release 编译,整轮会
    # 超过 30 分钟 → job 被 cancel,连 always 的回写与 Issue 都来不及
    # (实测:超时的轮次既无 ci/runs 回写、也无 Issue,因为根本没跑到那一步)。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustc -Vv && cargo -V && cargo fmt --version

      # ── 主验证:冒烟先跑 ────────────────────────────────────────────
      - name: Smoke (AppContainer + Job + token 闭环, 46 项断言)
        shell: pwsh
        env:
          # 段级进度回写要往仓库 push → 需要 token
          GH_TOKEN: ${{ github.token }}
        run: |
          & .\scripts\smoke.ps1 *>&1 | Tee-Object -FilePath smoke.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content smoke.log | Select-Object -Last 20 | ForEach-Object { Write-Host "::error::$_" }
          }
          exit $code

      # ── 门禁后置 ───────────────────────────────────────────────────
      # Windows 侧此前从未跑过 cargo test:单测只在 Unix 侧执行过。
      - name: Unit tests (all crates)
        shell: pwsh
        run: |
          cargo test --workspace 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish run result to repo
        if: always()
        # ⚠️ 用 bash(Git Bash)而不是 pwsh:与 Unix 侧**完全同一套**回写命令,
        # 少一处平台差异就少一处踩坑(实测 pwsh 版在这个步骤上连续两轮
        # 没能建出分支,而 bash 版一次就通)。
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          mkdir -p ci/runs
          out="ci/runs/${GITHUB_RUN_ID}-windows.md"
          {
            echo "# CI run ${GITHUB_RUN_ID} (windows)"
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- job status: ${JOB_STATUS}"
            echo
            echo '```text'
            # **完整**日志,不截断 —— 要的是「所有日志输出」,便于逐项核对。
            for f in smoke.log test.log; do
              echo "===== $f ====="
              if [ -f "$f" ]; then cat "$f"; fi
            done
            echo '```'
          } > "$out"
          # 防呆:日志异常大时不至于让 push 失败 → 保留头尾,截掉中段
          if [ "$(wc -c < "$out")" -gt 4000000 ]; then
            head -c 2500000 "$out" > "$out.trim"
            tail -c 1000000 "$out" >> "$out.trim"
            mv "$out.trim" "$out"
          fi
          export GIT_EDITOR=true
          export GIT_TERMINAL_PROMPT=0
          git config --global core.editor true || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ⚠️ 任何一步失败都不能中断后续:commit 在「无变更」时返回非零,
          # 一旦因此退出,就**永远走不到 push**,分支一个都建不出来(实测)。
          BR="ci-run/windows-smoke"
          g_add=$(git add -A ci 2>&1 || true)
          g_commit=$(git commit -q -m "ci: record run ${GITHUB_RUN_ID} windows [skip ci]" 2>&1 || true)
          g_push=$(git push --force origin "HEAD:$BR" 2>&1 || true)
          {
            echo "# git 回写日志 (run ${GITHUB_RUN_ID} windows)"
            echo '```text'
            echo "--- add ---";   echo "$g_add"
            echo "--- commit ---"; echo "$g_commit"
            echo "--- push ---";  echo "$g_push"
            echo "--- status ---"; git status --short 2>&1 | head -20
            echo "--- 远端 tip ---"; git ls-remote origin "$BR" 2>&1
            echo '```'
          } > "ci/runs/${GITHUB_RUN_ID}-windows-git.md"
          git add -A ci || true
          git commit -q -m "ci: record run ${GITHUB_RUN_ID} windows [skip ci]" || true
          git push --force origin "HEAD:$BR" || echo "::notice::结果回写失败,请看 run 日志与 Issue"

      # 失败时把完整日志落到 Issue:公开仓库可经 REST API 无鉴权读取,便于远端诊断
      - name: Publish failure log
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path smoke.log)) { "smoke.log missing" | Out-File smoke.log -Encoding utf8 }
          $raw = ""
          foreach ($f in @("smoke.log", "test.log")) {
            if (Test-Path $f) { $raw += "===== $f =====`n" + (Get-Content $f -Raw) + "`n" }
          }
          if ($raw -match 'SMOKE_DONE fail=0' -and $raw -notmatch 'test result: FAILED') {
            Write-Host 'smoke 已通过,跳过发布'; exit 0
          }
          if ($raw.Length -gt 60000) { $raw = $raw.Substring($raw.Length - 60000) }
          $md = "run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" + "`n`n" + '```text' + "`n" + $raw + "`n" + '```' + "`n"
          $payload = @{ title = "smoke failure $env:GITHUB_RUN_ID"; body = $md } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/issues" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
            -Body $payload -ContentType "application/json" | Out-Null

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aisbx-windows-binaries
          path: |
            target/release/aisbx.exe
            target/release/examples/burn.exe
          if-no-files-found: ignore
