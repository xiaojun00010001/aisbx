name: windows-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # contents: write —— 回写本次运行结果(与 cross-platform.yml 同理)
  contents: write
  issues: write

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustc -Vv && cargo -V

      # Windows 侧此前从未跑过 cargo test:单测只在 Unix 侧执行过。
      - name: Unit tests (all crates)
        shell: pwsh
        run: |
          cargo test --workspace 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke (AppContainer + Job + token 闭环, 18 项断言)
        shell: pwsh
        run: |
          & .\scripts\smoke.ps1 *>&1 | Tee-Object -FilePath smoke.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content smoke.log | Select-Object -Last 20 | ForEach-Object { Write-Host "::error::$_" }
          }
          exit $code

      - name: Publish run result to repo
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Force -Path ci/runs | Out-Null
          $raw = ""
          foreach ($f in @("smoke.log", "test.log")) {
            if (Test-Path $f) { $raw += (Get-Content $f -Raw) }
          }
          if ($raw.Length -gt 40000) { $raw = $raw.Substring($raw.Length - 40000) }
          $md = "# CI run $env:GITHUB_RUN_ID (windows)`n`n- commit: $env:GITHUB_SHA`n- job status: $env:JOB_STATUS`n`n" +
                "```text`n" + $raw + "`n```"
          Set-Content "ci/runs/$env:GITHUB_RUN_ID-windows.md" -Value $md -Encoding utf8
          Copy-Item "ci/runs/$env:GITHUB_RUN_ID-windows.md" "ci/last-run.md" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci
          git commit -q -m "ci: record run $env:GITHUB_RUN_ID windows [skip ci]"
          if ($LASTEXITCODE -ne 0) { Write-Host "::notice::commit 失败,回写跳过"; exit 0 }
          git push
          if ($LASTEXITCODE -ne 0) { Write-Host "::notice::结果回写失败(分支可能受保护),请看 run 日志" }

      # 失败时把完整日志落到 Issue:公开仓库可经 REST API 无鉴权读取,便于远端诊断
      - name: Publish failure log
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path smoke.log)) { "smoke.log missing" | Out-File smoke.log -Encoding utf8 }
          $raw = Get-Content smoke.log -Raw
          if ($raw -match 'SMOKE_DONE fail=0') { Write-Host 'smoke 已通过,跳过发布'; exit 0 }
          if ($raw.Length -gt 60000) { $raw = $raw.Substring($raw.Length - 60000) }
          $md = "run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" + "`n`n" + '```text' + "`n" + $raw + "`n" + '```' + "`n"
          $payload = @{ title = "smoke failure $env:GITHUB_RUN_ID"; body = $md } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/issues" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
            -Body $payload -ContentType "application/json" | Out-Null

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aisbx-windows-binaries
          path: |
            target/release/aisbx.exe
            target/release/examples/burn.exe
          if-no-files-found: ignore
